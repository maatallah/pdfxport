<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 220px;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: white;
            margin: 0;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
            color: #00ff88;
        }
        .status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }
        /* The Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        .label-text {
            font-size: 14px;
        }
        .footer {
            margin-top: 15px;
            font-size: 10px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">PDFXport</div>
    </div>
    
    <div class="status-container">
        <span class="label-text">Harvesting</span>
        <label class="switch">
            <input type="checkbox" id="harvestSwitch" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="footer">🚀 Pipeline Bridge Active</div>

    <script src="popup.js"></script>
</body>
</html>
