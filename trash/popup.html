<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 250px;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0f0e0d;
            color: #f0e6d2; /* Wheat cream */
            margin: 0;
            overflow: hidden;
        }
        .main-container {
            background: linear-gradient(180deg, #1a160f 0%, #0f0e0d 100%);
            padding: 15px;
            border: 1px solid #3d301c;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 1px solid #3d301c;
            padding-bottom: 10px;
        }
        .title {
            font-size: 18px;
            font-weight: 800;
            color: #ffb300; /* Golden Wheat */
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .server-status {
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 10px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #444;
        }
        .status-dot.online { background: #ffb300; box-shadow: 0 0 8px #ffb300; }
        .status-dot.offline { background: #ff4444; }

        .card {
            background: rgba(45, 38, 25, 0.4);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #4a3c25;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }
        .card::after {
            content: "🌾";
            position: absolute;
            right: -10px;
            bottom: -5px;
            font-size: 40px;
            opacity: 0.05;
            pointer-events: none;
        }
        .row { display: flex; align-items: center; justify-content: space-between; }
        .label-text { font-size: 13px; font-weight: 600; color: #d4c4a8; }
        .counter-text { font-size: 11px; color: #ffb300; margin-top: 4px; font-weight: bold; }

        /* The Switch */
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #222; transition: .3s; border-radius: 18px;
            border: 1px solid #4a3c25;
        }
        .slider:before {
            position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px;
            background-color: #ffb300; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #3d301c; }
        input:checked + .slider:before { transform: translateX(16px); background-color: #ffb300; }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-primary { 
            background: linear-gradient(90deg, #ffb300 0%, #e69500 100%); 
            color: #1a160f;
            box-shadow: 0 4px 15px rgba(255, 179, 0, 0.2);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255, 179, 0, 0.3); }
        .btn-danger { background: transparent; color: #888; font-size: 10px; margin-top: 10px; border: 1px solid #333; }
        .btn-danger:hover { color: #ff4444; border-color: #ff4444; }

        .footer {
            margin-top: 10px;
            font-size: 9px;
            color: #4a3c25;
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <div class="title">🌾 MOISSONNEUSE</div>
            <div class="server-status" id="serverStatus">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">...</span>
            </div>
        </div>
        
        <div class="card">
            <div class="row">
                <span class="label-text">Récolte Active</span>
                <label class="switch">
                    <input type="checkbox" id="harvestSwitch" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="card">
            <div class="label-text">Le Grenier (Staging)</div>
            <div class="counter-text" id="bufferCount">0 épi(s) prêt(s)</div>
            <button id="btnHarvest" class="btn btn-primary" style="margin-top: 12px;">Moissonner la Sélection</button>
            <button id="btnClear" class="btn btn-danger">Vider le Grenier</button>
        </div>

        <div class="footer">Moisson Automatisée v3.5 - 🚜 Prêt pour la récolte</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
